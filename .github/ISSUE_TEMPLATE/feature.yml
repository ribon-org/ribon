name: "機能リクエスト"
description: "新しい機能を提案する"
labels: ["type/feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: "概要"
      description: "どんな機能か"
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: "背景・モチベーション"
      description: "なぜこの機能が必要か"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "詳細"
      description: "実装イメージや受け入れ条件"
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: "対象エリア"
      options:
        - frontend
        - backend
        - db
        - auth
        - ui
        - infra
    validations:
      required: true
